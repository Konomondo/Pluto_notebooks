name: Deploy Pluto Notebooks
on:
    push:
        branches:
            - main
    workflow_dispatch:

# When two jobs run in parallel, cancel the older ones, to make sure that the website is generated from the most recent commit.
concurrency:
    group: pluto-export
    cancel-in-progress: true

# Jobs grant only the write permissions they need.
permissions:
    contents: read

jobs:
    deploy-pages:
        name: Deploy Github Pages
        permissions:
            contents: write # Publish the gh-pages branch.
            actions: write # Let the Julia cache remove superseded caches.
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: 🙌 Install Julia
              uses: julia-actions/setup-julia@v3.0.2
              with:
                  version: "1.12.7" # Keep aligned with the Docker image and notebook environment.
            - name: ⏱ Cache Julia artifacts & such
              uses: julia-actions/cache@v3.3.0
              with:
                cache-registries: "true"

            # We set up a folder that Pluto can use to cache exported notebooks. If the notebook file did not change, then Pluto can take the exported file from cache instead of running the notebook.
            - name: Set up notebook state cache
              uses: actions/cache@v6.1.0
              with:
                  path: pluto_state_cache
                  key: ${{ runner.os }}-pluto_state_cache-v2-${{ hashFiles('**/Project.toml', '**/Manifest.toml', '.github/workflows/*' ) }}-${{ hashFiles('**/*jl') }}
                  restore-keys: |
                      ${{ runner.os }}-pluto_state_cache-v2-${{ hashFiles('**/Project.toml', '**/Manifest.toml', '.github/workflows/*' ) }}

            - name: Install bind server requirements
              run: julia -e 'import Pkg; Pkg.instantiate();'
              env:
                JULIA_PROJECT: "./slider-server-environment"
      
            # PlutoSliderServer 0.3 requires old Pluto versions incompatible with modern Julia.
            - name: Run & export Pluto notebooks
              run: |
                julia --project=./slider-server-environment -e 'import Pluto, PlutoSliderServer, PlutoUI, HypertextLiteral
                  println("Julia ", VERSION, "; Pluto ", pkgversion(Pluto), "; PlutoSliderServer ", pkgversion(PlutoSliderServer))
                  PlutoSliderServer.github_action("./notebooks";
                    Export_output_dir=pwd(),
                    Export_cache_dir="pluto_state_cache",
                    Export_baked_notebookfile=false,
                    Export_baked_state=false,
                    Export_disable_ui=false,
                    Export_offer_binder=true, 
                    Export_slider_server_url="https://pluto.konomondo.org"
                    # more parameters can go here
                  )'
              env:
                JULIA_PROJECT: "./slider-server-environment"
            - name: 🚀 Build and Deploy to GitHub Pages
              uses: JamesIves/github-pages-deploy-action@v4.9.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: gh-pages
                  folder: .
    build-docker:
        name: Push Docker image to GitHub Packages
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-latest
        steps:
          - name: Check out the repo
            uses: actions/checkout@v7.0.1
          - name: Login to GitHub Container Registry
            uses: docker/login-action@v4.6.0
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4.3.0
          - name: Build and push
            uses: docker/build-push-action@v7.3.0
            with:
              context: .
              file: ./slider-server-environment/Dockerfile
              platforms: linux/amd64
              push: true
              labels: |
                org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
              tags: |
                ghcr.io/konomondo/pluto-server:latest
