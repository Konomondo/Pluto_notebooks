name: Deploy Pluto Notebooks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pluto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      julia-version: ${{ steps.version.outputs.julia-version }}
    env:
      GKSwstype: "100"
      JULIA_NUM_THREADS: "2"
      JULIA_NUM_PRECOMPILE_TASKS: "2"
      JULIA_LOAD_PATH: "@:@stdlib"
      JULIA_PROJECT: ${{ github.workspace }}/slider-server-environment
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        name: Read central Julia version
        shell: bash
        run: echo "julia-version=$(tr -d '\r\n' < .julia-version)" >> "$GITHUB_OUTPUT"
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ steps.version.outputs.julia-version }}
      - uses: julia-actions/cache@v3.3.0
        with:
          cache-registries: "true"
          delete-old-caches: "false"
      - name: Install headless plotting libraries
        run: sudo apt-get update && sudo apt-get install -y libxml2 libgl1 libxt6 libxrender1 libxext6
      - name: Install locked shared environment
        run: julia --startup-file=no tools/setup.jl
      - name: Test restricted mathematical formulas
        run: julia --startup-file=no tools/test_math_formulas.jl --symbolic
      - name: Test stateless game
        run: julia --startup-file=no tools/test_number_guessing_game.jl
      - name: Execute all notebooks and test slider HTTP requests
        run: julia --startup-file=no tools/test_notebooks.jl
      - name: Export validated notebooks
        run: julia --startup-file=no tools/export_notebooks.jl
      - name: Keep generated site
        uses: actions/upload-artifact@v7.0.2
        with:
          name: notebook-site
          path: build/site/
          if-no-files-found: error

  build-docker:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, execute Linux notebook tests and optionally push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: slider-server-environment/Dockerfile
          build-args: JULIA_VERSION=${{ needs.validate.outputs.julia-version }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/konomondo/pluto-server:latest
            ghcr.io/konomondo/pluto-server:sha-${{ github.sha }}

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: notebook-site
          path: build/site
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: build/site
