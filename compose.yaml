services:
  pluto:
    image: ghcr.io/konomondo/pluto-server:${PLUTO_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: slider-server-environment/Dockerfile
      args:
        JULIA_VERSION: ${JULIA_VERSION:?Use tools/docker.ps1 or set JULIA_VERSION from .julia-version}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      PLUTO_HOST: 0.0.0.0
      PLUTO_PORT: "1234"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
